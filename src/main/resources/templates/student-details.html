<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${pageTitle} + ' | BCI Campus'">Student Details</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
          rel="stylesheet"
          integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
          crossorigin="anonymous">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body class="details-page">
<nav class="navbar navbar-dark bg-primary shadow-sm">
    <div class="container">
        <a class="navbar-brand fw-bold" th:href="@{/}">BCI Student Portal</a>
    </div>
</nav>

<main class="container py-5">
    <div class="row justify-content-center">
        <div class="col-lg-8">
            <a class="btn btn-outline-primary mb-4" th:href="@{/}">Back to Dashboard</a>

            <div class="card border-0 shadow-sm overflow-hidden">
                <div class="card-header bg-primary text-white p-4">
                    <p class="mb-2 opacity-75">Student Profile</p>
                    <h1 class="h2 mb-0" th:text="${student.name}">Nimal Perera</h1>
                </div>
                <div class="card-body p-4 p-md-5">
                    <div class="row g-4">
                        <div class="col-md-6">
                            <p class="detail-label">Student ID</p>
                            <p class="detail-value" th:text="${student.id}">1</p>
                        </div>
                        <div class="col-md-6">
                            <p class="detail-label">Status</p>
                            <p>
                                <span class="badge"
                                      th:classappend="${student.status == 'Active'} ? ' text-bg-success' : ' text-bg-secondary'"
                                      th:text="${student.status}">Active</span>
                            </p>
                        </div>
                        <div class="col-md-6">
                            <p class="detail-label">Email</p>
                            <p class="detail-value" th:text="${student.email}">nimal@bci.lk</p>
                        </div>
                        <div class="col-md-6">
                            <p class="detail-label">Programme</p>
                            <p class="detail-value" th:text="${student.programme}">Software Engineering</p>
                        </div>
                        <div class="col-12">
                            <div class="d-flex justify-content-between mb-2">
                                <p class="detail-label mb-0">Course Progress</p>
                                <strong th:text="${student.progress} + '%'">85%</strong>
                            </div>
                            <div class="progress progress-lg">
                                <div class="progress-bar"
                                     th:style="'width: ' + ${student.progress} + '%'"
                                     th:attr="aria-valuenow=${student.progress}"
                                     aria-valuemin="0" aria-valuemax="100"></div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
</body>
</html>
